<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Hand Sandbox</title>
    <style>
      html, body, #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div class="panel">
          <div class="title">AI Hand Sandbox</div>
          <div class="subtitle">Demo mode • no webcam preview in the game world</div>
          <div class="controls">
            <input id="command" placeholder="Try: spawn box, spawn ball, clear, help" />
            <button id="send-command">Run</button>
            <button id="reset-scene">Clear</button>
          </div>
          <div id="status">Status: booting...</div>
          <div class="tips">Commands: spawn box, spawn ball, spawn sword, spawn metal ball, clear, help</div>
        </div>
      </div>
      <div id="canvas-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
