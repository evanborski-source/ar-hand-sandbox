<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Hand Sandbox</title>
    <style>
      html,body,#app { height: 100%; margin: 0; }
      #overlay { position: absolute; left: 12px; top: 12px; z-index: 10; color: white; }
      .panel { background: rgba(0,0,0,0.4); padding: 8px; border-radius: 6px; }
      #canvas-container { width: 100%; height: 100%; }
      input, button { font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="overlay">
        <div class="panel">
          <div>
            <input id="cmd" placeholder="Type command, e.g. 'spawn box'" />
            <button id="send">Send</button>
            <button id="reset">Reset</button>
          </div>
          <div id="status">Status: initializing</div>
        </div>
      </div>
      <div id="canvas-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
